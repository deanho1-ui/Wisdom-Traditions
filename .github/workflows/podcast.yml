name: Record podcast

on:
  push:
    branches: [main]
    paths: [podcast/episodes.json, scripts/render_podcast.py, .github/workflows/podcast.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audio tools
        run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
      - name: Install Kokoro
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile numpy
      - name: Record changed episodes
        run: python scripts/render_podcast.py
      - name: Commit audio and feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Record podcast audio"
          git pull --rebase origin main
          git push
